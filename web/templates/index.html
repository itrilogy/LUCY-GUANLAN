<!-- 顶栏 (Top Shell) -->
<header class="top-shell">
  <div class="top-nav">

      <!-- 规范产品方标 (.brick 架构) -->
      <div class="brick" title="观澜 · GuanLan 方标 (红蓝球 + 市场曲线)">
        <svg aria-hidden="true"><use href="#guanlan-motif"></use></svg>
        <span class="stream"></span><span class="star"></span>
      </div>
      <div class="brand-meta">
        <div class="brand-title-row">
          <span class="brand-name">观澜 · GuanLan</span>
          <span class="brand-slogan">观水有术，由表及澜</span>
        </div>
        <div class="brand-lab-by">
          <!-- 实验室角本位符号标（无方框，浅/深/金自适应） -->

<main class="viewport">
  <!-- 诚实原则声明横幅 (L-U-X-I Honesty Banner) -->

    <div class="honesty-text">
      <strong>方法边界说明：</strong>本系统客观刻画奖池状态与组合拥挤度，红蓝球开奖接近真随机，算法一致性评分非中奖预言。
    </div>
    <div class="data-status-badge" id="hi">
      <span>正在连接数据服务...</span>
    </div>

  <!-- 全局行动条 (收敛按钮层级：每屏唯一鹿溪绿 Primary) -->
  <div class="action-bar">
    <!-- 主行动：唯一 Primary 按钮 -->
    <button class="btn btn-primary" onclick="runFast()" title="执行快速推理验证">
      <svg><use href="#icon-play"></use></svg>
      <span>快速推理</span>
    </button>
    <!-- 次级行动：Secondary 按钮 -->
    <button class="btn btn-secondary" id="btn-evolve" onclick="runFull()" title="自洽进化研究 (非命中承诺)">
      <svg><use href="#icon-dna"></use></svg>
      <span>全量研究</span>
    </button>
    <button class="btn btn-secondary" onclick="updateData()" title="拉取最新期次历史数据">
      <svg><use href="#icon-refresh"></use></svg>
      <span>更新数据</span>
    </button>
    <button class="btn btn-secondary" onclick="saveComparison()" title="保存当前推荐供对照校验">
      <svg><use href="#icon-save"></use></svg>
      <span>保存对照</span>
    </button>

    <!-- 运行状态与进度指示 -->
    <div class="action-progress">
      <div class="action-prog-bar"><div class="action-prog-fill" id="pf"></div></div>
      <span class="action-prog-label" id="pl">就绪</span>
    </div>
  </div>

  <!-- 标签页导航 (Tabs) -->
  <nav class="nav-tabs" role="tablist">
    <button class="nav-tab-btn active" role="tab" onclick="sw('pred')">
      <svg><use href="#icon-chart"></use></svg>
      <span>推理与市场分析</span>
    </button>
    <button class="nav-tab-btn" role="tab" onclick="sw('cmp')">
      <svg><use href="#icon-compare"></use></svg>
      <span>预测对照验证</span>
    </button>
  </nav>

  <!-- 标签内容区 1：推理预测与市场大盘 -->
  <div id="tp" class="tab-pane active"></div>

  <!-- 标签内容区 2：预测对照验证 -->
  <div id="tcmp" class="tab-pane"></div>

  <!-- 页脚 (Foot Shell，遵循无写实主标、符号标纯粹化) -->

    <div class="foot-brand-row">
      <svg style="width:20px;height:20px;color:var(--luxi-cyan);flex-shrink:0"><use href="#luxi-symbol-mark"></use></svg>
      <span>鹿溪联合创新实验室 · LUXI Joint Innovation Lab</span>
    </div>
    <p class="foot-desc">
      观澜（GuanLan）属于鹿溪「理数·三思」矩阵，专注于复杂组合结构与宏观状态推演。示例数据与推荐序列均属模型自洽排序，不构成任何投注指令或回报承诺。
    </p>
    <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">
      数据源: 500.com · <span id="ft">就绪</span> · 遵循 LUXI Design System
    </div>
  </footer>
</main>

<script>
window.onerror=function(msg,url,line){
  let el=document.getElementById('ft');
  if(el) el.textContent+=' ERR:'+msg+' L:'+line;
  return true;
};

// ── 主题与密度控制 ──
const htmlEl = document.documentElement;
const themeSelect = document.getElementById("theme-select");
const densitySelect = document.getElementById("density-select");

if(themeSelect){
  themeSelect.addEventListener("change", (e)=>{
    htmlEl.setAttribute("data-theme", e.target.value);
    localStorage.setItem("guanlan_theme", e.target.value);
  });
  let savedTheme = localStorage.getItem("guanlan_theme");
  if(savedTheme){
    themeSelect.value = savedTheme;
    htmlEl.setAttribute("data-theme", savedTheme);
  }
}

if(densitySelect){
  densitySelect.addEventListener("change", (e)=>{
    htmlEl.setAttribute("data-density", e.target.value);
    localStorage.setItem("guanlan_density", e.target.value);
  });
  let savedDensity = localStorage.getItem("guanlan_density");
  if(savedDensity){
    densitySelect.value = savedDensity;
    htmlEl.setAttribute("data-density", savedDensity);
  }
}

let D=null, H=null, H_HTML='', CMP=null;
async function get(u){ let r=await fetch(u); return await r.json(); }

function sw(n){
  document.querySelectorAll('.nav-tab-btn').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(e=>e.classList.remove('active'));
  let clickedTab = document.querySelector(`.nav-tab-btn[onclick*="${n}"]`);
  if(clickedTab) clickedTab.classList.add('active');
  let targetPane = document.getElementById('t'+(n==='cmp'?'cmp':'p'));
  if(targetPane) targetPane.classList.add('active');
  if(n==='cmp') loadComparisonPage();
}

(async()=>{
  try{
    let s=await get('/api/status');
    let hi=document.getElementById('hi');
    if(hi){
      hi.innerHTML='<span>第 <strong>'+s.data_version+'</strong> 期 · '+s.total_draws+' 期历史样本</span>';
    }
    D=await get('/api/predict');
    render();
    rd(D);
    document.getElementById('ft').textContent='已连接';
    loadHistory();
  }catch(e){
    console.error('Init error:',e);
    document.getElementById('ft').textContent='初始化异常: '+e.message;
  }
})();

function $(i){ return document.getElementById(i); }
function sleep(m){ return new Promise(r=>setTimeout(r,m)); }

// ── 渲染主界面 ──
function render(){
  let d=D;
  if(!d) return;
  let pe=(d.market.pool/1e8).toFixed(2), be=(d.market.bet/1e8).toFixed(2);
  let rC=d.market.regime==='放水'?'var(--alert-red)':d.market.regime==='平衡'?'var(--luxi-gold)':'var(--info-blue)';
  let rW=d.market.regime==='放水'?'80%':d.market.regime==='平衡'?'50%':'20%';

  let h = '';
  // 1. KPI 状态仪表卡片
  h += `<div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">市场状态</div>
      <div class="kpi-value" style="color:${rC}">${d.market.regime}</div>
      <div class="meter-track"><div class="meter-fill" style="width:${rW};background:${rC}"></div></div>
      <div class="kpi-sub">蓄水 ← 平衡 → 放水</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">奖池规模</div>
      <div class="kpi-value">${pe}<small>亿</small></div>
      <div class="kpi-sub">预期区间 ${(d.market.predicted_pool_range[0]/1e8).toFixed(1)} ~ ${(d.market.predicted_pool_range[1]/1e8).toFixed(1)} 亿</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">当期投注估计</div>
      <div class="kpi-value">${be}<small>亿</small></div>
      <div class="kpi-sub">${['崩溃态','蓄水态','大奖态','增长态','成熟态'][parseInt(d.market.regime_id)]||('Regime '+d.market.regime_id)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">热门特征</div>
      <div class="kpi-value" style="font-size:15px;letter-spacing:1px">${d.popularity.hot.slice(0,6).join(', ')}</div>
      <div class="kpi-sub">生日效应权重 ${d.popularity.birthday_effect}x</div>
    </div>
  </div>`;

  // 2. 推荐号码列表
  let allP=[...d.predictions], rCnt={}, bCnt={};
  d.predictions.forEach(p=>{
    p.reds.forEach(r=>{ rCnt[r]=(rCnt[r]||0)+1; });
    bCnt[p.blue]=(bCnt[p.blue]||0)+1;
  });
  let sortedR=Object.entries(rCnt).sort((a,b)=>b[1]-a[1]);
  let topR=sortedR.slice(0,6).map(e=>parseInt(e[0])).sort((a,b)=>a-b);
  let r2=sortedR.slice(6,12).map(e=>parseInt(e[0])).sort((a,b)=>a-b);
  let topB=parseInt(Object.entries(bCnt).sort((a,b)=>b[1]-a[1])[0][0]);
  let topB2=parseInt(Object.entries(bCnt).sort((a,b)=>b[1]-a[1])[1][0])||topB;
  allP.push({rank:11, reds:topR, blue:topB, consistency:0.30, cost:0, est_prize1:5});
  allP.push({rank:12, reds:r2, blue:topB2, consistency:0.30, cost:0, est_prize1:5});

  h += `<div class="section-title-bar">
    <div class="section-title">
      <span>序列推荐</span>
      <span class="section-desc">1-10注基于双向验证 · 11-12注为频次聚合 (评分非中奖概率)</span>
    </div>
    <button class="btn btn-secondary" onclick="copyNumbers()" style="height:26px;padding:0 8px;font-size:11px">
      <svg><use href="#icon-copy"></use></svg>
      <span>复制序列</span>
    </button>
  </div>`;

  h += `<div class="pred-grid">`;
  allP.forEach(p=>{
    let rb=p.reds.map(r=>`<span class="ball ball-red">${String(r).padStart(2,'0')}</span>`).join('');
    let bb=`<span class="ball ball-blue">${String(p.blue).padStart(2,'0')}</span>`;
    let sc=p.scores;
    let isAgg = p.rank >= 11;
    let seqBadge = isAgg ? '频次聚合' : '双向验证';
    let finalScore = sc ? (sc.final*100).toFixed(0) : '—';
    let cardHeader = `
      <div class="pred-card-header">
        <div class="pred-seq-badge">
          <span class="pred-seq-num">#${String(p.rank).padStart(2,'0')}</span>
          <span class="pred-type-label">${seqBadge}</span>
        </div>
        ${sc ? `<div class="pred-final-score">综合评分 <strong>${finalScore}</strong></div>` : `<div class="pred-final-score" style="color:var(--text-muted)">聚合推荐</div>`}
      </div>
    `;

    let ballText = p.reds.map(r=>String(r).padStart(2,'0')).join(',') + ' + ' + String(p.blue).padStart(2,'0');
    let ballsTrack = `
      <div class="pred-balls-track">
        <div class="pred-balls-group">
          ${rb}
          <span class="ball-divider"></span>
          ${bb}
        </div>
        <button class="btn-copy-single" onclick="copySingle('${ballText}')" title="复制此单注号码">
          <svg style="width:12px;height:12px"><use href="#icon-copy"></use></svg>
          <span>单注</span>
        </button>
      </div>
    `;

    let metricsRow;
    if(sc){
      metricsRow = `
        <div class="pred-metrics-row">
          <div class="metric-chip">
            <span class="metric-chip-title">抗拥挤度</span>
            <span class="metric-chip-val">${(sc.anti_crowd*100).toFixed(0)}</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">组合结构</span>
            <span class="metric-chip-val">${(sc.structure*100).toFixed(0)}</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">市场匹配</span>
            <span class="metric-chip-val">${(sc.market_fit*100).toFixed(0)}</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">模型自洽</span>
            <span class="metric-chip-val" style="color:var(--text-warn)">${(p.consistency*100).toFixed(0)}%</span>
          </div>
        </div>
      `;
    }else{
      let cost=(p.cost!=null&&!isNaN(p.cost))?Number(p.cost).toFixed(1):'0.0';
      metricsRow = `
        <div class="pred-metrics-row">
          <div class="metric-chip">
            <span class="metric-chip-title">模型自洽</span>
            <span class="metric-chip-val" style="color:var(--text-warn)">${(p.consistency*100).toFixed(0)}%</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">模拟成本</span>
            <span class="metric-chip-val">${cost}</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">预估注数</span>
            <span class="metric-chip-val">${p.est_prize1||0} 注</span>
          </div>
          <div class="metric-chip">
            <span class="metric-chip-title">来源方式</span>
            <span class="metric-chip-val" style="font-size:11px">Top10 频次</span>
          </div>
        </div>
      `;
    }

    h += `<div class="pred-card">
      ${cardHeader}
      ${ballsTrack}
      ${metricsRow}
    </div>`;
  });
  h += `</div>`;

  // 3. 复式推荐
  h += `<div class="section-title-bar">
    <div class="section-title">
      <span>复式规划方案</span>
      <span class="section-desc">基于全验证池贪心加权</span>
    </div>
  </div>
  <div class="compound-grid">`;
  d.compound_plans.forEach(c=>{
    let rBalls = c.reds.map(r=>`<span class="ball ball-red ball-sm">${String(r).padStart(2,'0')}</span>`).join('');
    let bBalls = c.blues.map(b=>`<span class="ball ball-blue ball-sm">${String(b).padStart(2,'0')}</span>`).join('');
    h += `<div class="compound-card">
      <div class="compound-header">
        <span class="compound-tier">${c.tier_name}</span>
        <span class="compound-desc">${c.tier_desc}</span>
      </div>
      <div class="compound-balls-row">${rBalls}${bBalls}</div>
      <div class="compound-stats">
        <span>成本 <strong>${c.total_cost}</strong> 元</span>
        <span>组合 <strong>${c.total_combos}</strong> 注</span>
        <span>均值 <strong>${(c.avg_match_rate*100).toFixed(1)}%</strong></span>
        <span>自洽 <strong>${(c.consistency*100).toFixed(0)}%</strong></span>
      </div>
    </div>`;
  });
  h += `</div>`;

  // 复式构建步骤轨迹
  h += `<div id="sx" style="display:none;margin-bottom:16px;">
    <div class="card">
      <div class="card-header"><h4 class="card-title">复式贪心构建轨迹</h4></div>
      <div id="sl" style="max-height:160px;overflow-y:auto"></div>
    </div>
  </div>`;

  // 历史图表插入容器
  h += `<div id="history-section"></div>`;

  document.getElementById('tp').innerHTML = h;
  if(d.compound_plans&&d.compound_plans[0]&&d.compound_plans[0].build_steps) rd(d);
}

function modeQS(){
  let m=window.SSQ_MODE||'';
  return m?('&mode='+encodeURIComponent(m)):'';
}

let SYS={evolution_mode:'off',scoring_mode:'legacy'};
async function refreshStatus(){

function _cmpParseReds(c){
  if(Array.isArray(c.reds)) return c.reds.map(Number).filter(n=>!isNaN(n)&&n>0);
  try{ return JSON.parse(c.reds||'[]').map(Number).filter(n=>!isNaN(n)&&n>0); }catch(e){ return []; }
}
function _cmpParseBlues(c){
  if(Array.isArray(c.blues)&&c.blues.length) return c.blues.map(Number).filter(n=>!isNaN(n)&&n>0);
  if(c.blue===null||c.blue===undefined||c.blue==='') return [];
  if(typeof c.blue==='number') return [c.blue];
  try{
    let v=JSON.parse(c.blue);
    if(Array.isArray(v)) return v.map(Number).filter(n=>!isNaN(n)&&n>0);
    let n=Number(v); return isNaN(n)?[]:[n];
  }catch(e){
    let n=Number(c.blue); return isNaN(n)?[]:[n];
  }
}

function _cmpBall(n, isBlue, isHit, drawn){
  let num = String(n).padStart(2,'0');
  let ballClass = isBlue ? 'ball-blue' : 'ball-red';
  if(!drawn){
    return `<span class="cmp-ball ${ballClass}">${num}</span>`;
  }
  if(isHit){
    return `<span class="cmp-ball ${ballClass} ball-hit" title="命中">${num}</span>`;
  }
  return `<span class="cmp-ball ${ballClass} ball-miss">${num}</span>`;
}

function filterComparison(){
  let issue=document.getElementById('cmp-issue')?.value||'';
  let batch=document.getElementById('cmp-batch')?.value||'';
  let filtered=CMP.filter(c=>(!issue||c.target_issue===issue)&&(!batch||String(c.batch_id)===String(batch)));
  let div=document.getElementById('cmp-results');
  if(!div) return;

  if(!filtered.length){
    div.innerHTML='<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:13px">暂无保存的推演快照。可在推理页计算后点击上方「保存对照」记录快照。</div>';
    return;
  }

  let h='';
  filtered.forEach(c=>{
    let isCompound = c.entry_type==='compound'||(c.reds_count&&c.reds_count>6);
    let predReds = _cmpParseReds(c);
    let predBlues = _cmpParseBlues(c);
    let actualReds = Array.isArray(c.actual_reds)?c.actual_reds.map(Number).filter(n=>n>0):[];
    let drawn = !!(c.drawn===true || actualReds.length===6);
    let aSet = new Set(actualReds);
    let hitReds = new Set(drawn?predReds.filter(n=>aSet.has(Number(n))):[]);
    let hitBlues = new Set();
    if(drawn && c.actual_blue!=null && c.actual_blue!==''){
      let ab=Number(c.actual_blue);
      hitBlues = new Set(predBlues.filter(b=>Number(b)===ab));
    }

    let predBalls = predReds.map(n=>_cmpBall(n,false,hitReds.has(Number(n)),drawn)).join('')
      + predBlues.map(b=>_cmpBall(b,true,hitBlues.has(Number(b)),drawn)).join('');

    let actualHtml = '';
    if(drawn){
      let predSet = new Set(predReds.map(Number));
      let aBalls = actualReds.map(n=>_cmpBall(n,false,predSet.has(Number(n)),true)).join('');
      let aBlueHit = predBlues.some(b=>Number(b)===Number(c.actual_blue));
      aBalls += _cmpBall(c.actual_blue, true, aBlueHit, true);
      actualHtml = `<div class="cmp-balls"><span style="font-size:11px;color:var(--text-muted);width:32px">开奖</span>${aBalls}</div>`;
    }

    let statusTag = drawn ? '<span class="tag tag-ok">已开奖</span>' : '<span class="tag tag-neutral">未开奖</span>';
    let hr = hitReds.size, hb = hitBlues.size?1:0;
    let needR = isCompound?(c.reds_count||predReds.length||6):6;
    let hitScore = drawn ? `命中 红 ${hr}/${needR} · 蓝 ${hb?'✓':'✗'}` : '待开奖核对';
    let hitTagClass = drawn ? (hr>=3 ? 'tag-ok' : (hr>=1 ? 'tag-warn' : 'tag-neutral')) : 'tag-neutral';
    let rankDisplay = isCompound ? ('复式 '+c.rank) : ('#'+c.rank);
    let cons = c.consistency!=null ? (c.consistency*100).toFixed(0)+'%' : '—';

    h += `<div class="cmp-row">
      <div class="cmp-meta">
        <span style="font-family:var(--font-mono);color:var(--text-muted)">批次 #${c.batch_id}</span>
        <span style="font-weight:600;color:var(--text-primary)">第 ${c.target_issue} 期</span>
        <span style="font-weight:600;color:var(--luxi-gold)">${rankDisplay}</span>
        ${statusTag}
        <span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">自洽度 ${cons}</span>
        <span class="tag ${hitTagClass}">${hitScore}</span>
      </div>
      <div class="cmp-balls"><span style="font-size:11px;color:var(--text-muted);width:32px">推演</span>${predBalls}</div>
      ${actualHtml}
    </div>`;
  });
  div.innerHTML=h;
}

function rd(d){
  let cp=d.compound_plans;
  if(!cp||!cp[0]||!cp[0].build_steps) return;
  let st=cp[0].build_steps, sx=$('sx'), sl=$('sl');
  if(!sx||!sl) return;
  sx.style.display='block';
  sl.innerHTML='';
  let mc=Math.max(...st.map(s=>s.coverage))||1;
  st.forEach(s=>{
    let pct=(s.coverage*100).toFixed(2), bw=Math.max(1,(s.coverage/mc*100));
    let cl=s.action==='加红球'?'var(--product-accent)':s.action==='加蓝球'?'var(--product-accent-2)':'var(--text-muted)';
    let bh=s.ball?`<span class="ball ball-sm" style="background:${cl};margin-right:4px">${String(s.ball).padStart(2,'0')}</span>`:'';
    sl.innerHTML+=`<div style="display:flex;align-items:center;padding:4px 6px;font-size:11px;gap:6px;border-bottom:1px solid var(--border-subtle)">
      <span style="color:var(--text-muted);font-family:var(--font-mono);min-width:20px">#${s.step}</span>
      ${bh}
      <span style="min-width:54px">${s.action}</span>
      <span style="color:var(--text-muted);min-width:40px">${s.reds_count}红</span>
      <div class="meter-track" style="flex:1;height:6px;margin:0"><div class="meter-fill" style="width:${bw}%;background:${cl}"></div></div>
      <span style="min-width:40px;text-align:right;font-family:var(--font-mono)">${pct}%</span>
    </div>`;
  });
}

    <div style="display:flex;gap:12px;overflow-x:auto">
      <div style="flex:2;min-width:0">${d.red_chart_svg||''}</div>
      <div style="flex:1;min-width:0">${d.blue_chart_svg||''}</div>
    </div>
    <div class="chart-footnote">
      <strong>口径说明：</strong>主序列（红球）与次序列（蓝球）累计出号次数柱状分布。网格线统一取 --border-subtle，严格禁止 3D 与过饱和渐变填充。
    </div>
  </div>`;

  // 3. 奖池走势曲线
  h += `<div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">奖池规模全量走势 (${d.pool_dense.length} 期样本)</span>
      <span class="tag tag-neutral">单位：亿元</span>
    </div>
    <div style="min-height:110px">${d.pool_chart_svg||''}</div>
    <div class="chart-footnote">
      <strong>口径说明：</strong>数据源自中国福彩官网开奖公告历史结存奖池金额。平滑面积采用不超过 0.25 透明度沉浸过渡。
    </div>
  </div>`;

  // 4. Regime 状态分布
  let cols=['var(--product-accent)','var(--product-accent-2)','var(--luxi-gold)','var(--text-ok)','var(--luxi-cyan)'];
  let nams=['崩溃态','蓄水态','大奖态','增长态','成熟态'];
  h += `<div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">市场宏观状态分布 (GMM 5 阶隐马尔可夫分型)</span>
      <span class="tag tag-neutral">无监督聚类</span>
    </div>
    <div class="regime-grid">`;
  d.regime_dist.forEach(r=>{
    let sh='';
    if(r.samples) r.samples.forEach(s=>{
      let rs=s.reds.map(n=>`<span class="ball ball-red" style="width:16px;height:16px;font-size:8px">${String(n).padStart(2,'0')}</span>`).join('');
      let bs=`<span class="ball ball-blue" style="width:16px;height:16px;font-size:8px">${String(s.blue).padStart(2,'0')}</span>`;
      sh+=`<div style="font-size:9px;color:var(--text-muted);margin-top:4px">${s.issue}</div><div style="display:flex;justify-content:center;gap:1px;margin-top:1px">${rs}${bs}</div>`;
    });
    h += `<div class="regime-cell">
      <div class="regime-pct" style="color:${cols[r.regime]}">${r.pct}%</div>
      <div class="regime-name">${nams[r.regime]}</div>
      <div class="regime-count">${r.count} 期样本</div>
      ${sh}
    </div>`;
  });
  h += `</div>
    <div class="chart-footnote">
      <strong>口径说明：</strong>基于历史每期奖池变量、投注额及头奖注数的三维 GMM 分类，刻画不同市场流动性下的状态转移。
    </div>
  </div>`;

  // 5. 反向回溯
  try{
    let bt=await get('/api/predict/backtrack?steps=5');
    if(bt&&bt.chain){
      h += `<div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">状态转移反向回溯 (T_bwd 动力链条)</span>
          <span class="tag tag-neutral">5步状态回溯</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0">`;
      bt.chain.forEach(function(c,i){
        let isCurrent=i===0;
        let arrow=i>0?'<span style="color:var(--text-muted);font-size:12px;flex-shrink:0">←</span>':'';
        let label=isCurrent?'当前目标期':'-'+i+' 步';
        h += arrow + `<div style="flex:1;min-width:90px;text-align:center;background:var(--bg-sunken);border:1px solid ${isCurrent?'var(--color-primary)':'var(--border-subtle)'};border-radius:var(--radius-sm);padding:8px 4px">
          <div style="font-size:10px;color:var(--text-muted)">${label}</div>
          <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin:2px 0">${c.name}</div>
          ${c.prob!==undefined?`<div style="font-size:10px;color:var(--text-secondary)">转移概率 ${(c.prob*100).toFixed(0)}%</div>`:''}
        </div>`;
      });
      h += `</div>
        <div class="chart-footnote">口径：基于转移矩阵后向概率，反推当期状态发生的前序条件链，已纳入综合评分调整。</div>
      </div>`;
    }
  }catch(e){}

  let hs=document.getElementById('history-section');
  if(hs){ hs.innerHTML=h; H_HTML=h; }

  // 加载 33+16 号码矩阵表格
  loadZone(d);
}

function loadZone(d){
  let periodsTotal=d.zone_series.length||3481;
  let h = `<div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">每期号码分布矩阵 (33红 + 16蓝网格)</span>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn btn-secondary" style="height:24px;padding:0 8px;font-size:10px" onclick="zonePage(-1)">◀ 上一页</button>
        <span id="zone-page-info" style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">第 1 页</span>
        <button class="btn btn-secondary" style="height:24px;padding:0 8px;font-size:10px" onclick="zonePage(1)">下一页 ▶</button>
      </div>
    </div>
    <div class="zone-table-container">
      <table class="zone-table">
        <thead>
          <tr>`;
  for(let n=1;n<=33;n++) h+=`<th style="color:var(--product-accent)">${String(n).padStart(2,'0')}</th>`;
  h+=`<th style="width:4px;padding:0"></th>`;
  for(let n=1;n<=16;n++) h+=`<th style="color:var(--product-accent-2)">${String(n).padStart(2,'0')}</th>`;
  h+=`<th style="width:60px;text-align:right;padding-right:6px">开奖期次</th></tr></thead>
        <tbody id="zone-tbody"></tbody>
      </table>
    </div>
    <div class="chart-footnote">口径：历史全部期次开奖落点热力，红蓝点亮代表出号，空心为未出。单页展示 200 期。</div>
  </div>`;

  let hs2=document.getElementById('history-section');
  if(hs2) hs2.innerHTML+=h;
  zonePage(0);
}

async function zonePage(dir){
  let info=document.getElementById('zone-page-info');
  if(!info) return;
  let m=info.textContent.match(/\d+/);
  let page=dir===0?1:parseInt(m?m[0]:1)+dir;
  if(page<1) return;
  let per=200;
  try{
    let d=await(await fetch('/api/periods?page='+page+'&per_page='+per)).json();
    document.getElementById('zone-page-info').textContent='第 '+page+' / '+Math.ceil(d.total/per)+' 页';
    let tb=document.getElementById('zone-tbody');
    if(!tb) return;
    tb.innerHTML='';
    d.periods.forEach(p=>{
      let rs=new Set(p.reds);
      let r='';
      for(let n=1;n<=33;n++){
        let on=rs.has(n);
        r+='<td><span class="'+(on?'cell-dot-on-red':'cell-dot-off')+'">'+(on?String(n).padStart(2,'0'):'·')+'</span></td>';
      }
      let b='';
      for(let n=1;n<=16;n++){
        let on=p.blue===n;
        b+='<td><span class="'+(on?'cell-dot-on-blue':'cell-dot-off')+'">'+(on?String(n).padStart(2,'0'):'·')+'</span></td>';
      }
      tb.innerHTML+='<tr>'+r+'<td style="width:4px;padding:0"></td>'+b+'<td style="text-align:right;padding-right:6px;color:var(--text-muted)">'+p.issue+'</td></tr>';
    });
  }catch(e){}
}
</script>
</body>
</html>
