<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="观澜 · GuanLan 官方产品方标">
  <!-- 鹿溪产品方标基石 (.brick, 48x48, r=12) -->
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#0D5E42"/>

  <!-- 观澜 24 视口标准单色业务图形 (居中放置于 x:12~36, y:8~32) -->
  <!-- 业务图形定义：红蓝球 (cx:9 cy:13 r:3 fill:#E74C3C / cx:15 cy:11 r:3 fill:#3498DB) -->
  <g transform="translate(12, 9)">
    <circle cx="9" cy="13" r="3.2" fill="#E74C3C"/>
    <circle cx="15" cy="11" r="3.2" fill="#3498DB"/>
  </g>

  <!-- 底部水平溪流 (.stream: left 8, right 8, bottom 6, h 3, r 1.5) -->
  <defs>
    <linearGradient id="luxi-stream-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect x="8" y="39" width="32" height="3" rx="1.5" fill="url(#luxi-stream-flow)"/>

  <!-- 右上角金色五角星 (.star: top 5, right 5, w 5, h 5, fill:#F1C40F) -->
  <polygon points="40.5,5 41.05,6.75 43,6.75 41.4,7.85 41.95,9.55 40.5,8.5 39.05,9.55 39.6,7.85 38,6.75 39.95,6.75" fill="#F1C40F"/>
</svg>
