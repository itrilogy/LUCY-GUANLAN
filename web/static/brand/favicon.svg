<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="观澜 · GuanLan">
  <!--
    产品 favicon（鹿溪 CI）
    - 鹿溪绿底：#0D5E42 实验室品牌
    - 红球 + 蓝球：双色球
    - 底部溪流：市场状态流 / 数据流动
    - 源启星点：#00D2FF 灵感
  -->
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="stream" x1="5" y1="24" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <circle cx="10" cy="9" r="7" fill="#ffffff" opacity="0.06"/>

  <!-- red ball cluster (market / ticket) -->
  <circle cx="11" cy="13" r="4.2" fill="#E74C3C"/>
  <circle cx="10.2" cy="12.2" r="1.2" fill="#ffffff" opacity="0.35"/>
  <circle cx="16.2" cy="11.2" r="3.1" fill="#C0392B"/>
  <circle cx="15.6" cy="10.6" r="0.8" fill="#ffffff" opacity="0.28"/>

  <!-- blue ball -->
  <circle cx="21.5" cy="15.5" r="3.6" fill="#3498DB"/>
  <circle cx="20.7" cy="14.7" r="1.0" fill="#ffffff" opacity="0.4"/>

  <!-- mini sparkline (market) -->
  <path d="M7 20.5 L11 19.2 L14.5 20.8 L18 18.6 L22 19.4 L25 17.8"
        fill="none" stroke="#F5F7FA" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- stream -->
  <path d="M5.5 25.4 C9.2 23.9, 12.5 26.5, 16 25.2 C19.2 24.0, 22.2 24.9, 26.5 24.0"
        fill="none" stroke="url(#stream)" stroke-width="1.55" stroke-linecap="round"/>

  <!-- 源启 diamond spark -->
  <g transform="translate(24.4 7.0)">
    <path d="M0-2.2 L0.5-0.5 L2.2 0 L0.5 0.5 L0 2.2 L-0.5 0.5 L-2.2 0 L-0.5-0.5 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.5" fill="#F5F7FA"/>
  </g>
</svg>
