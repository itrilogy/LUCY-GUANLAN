<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" role="img" aria-label="观澜 · GuanLan">
  <!-- Header wordmark: product mark + title (dark UI friendly) -->
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
  </defs>

  <!-- product mark tile -->
  <rect x="2" y="4" width="48" height="48" rx="12" fill="url(#tile)"/>
  <circle cx="18" cy="24" r="7.5" fill="#E74C3C"/>
  <circle cx="16.5" cy="22.5" r="2" fill="#fff" opacity="0.35"/>
  <circle cx="28" cy="21" r="5.5" fill="#C0392B"/>
  <circle cx="35" cy="30" r="6.2" fill="#3498DB"/>
  <circle cx="33.5" cy="28.5" r="1.6" fill="#fff" opacity="0.4"/>
  <path d="M12 38 L18 35.5 L24 38.5 L30 34 L38 36"
        fill="none" stroke="#F5F7FA" stroke-width="1.6" stroke-linecap="round"/>
  <path fill="#00D2FF" d="M40 12 L42.2 14.2 L40 16.4 L37.8 14.2 Z"/>

  <!-- titles -->
  <text x="62" y="28" fill="#F1C40F" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"
        font-size="18" font-weight="700" letter-spacing="0.08em">观澜 · GuanLan</text>
  <text x="62" y="46" fill="#7F8FA6" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"
        font-size="11">观水有术，由表及澜</text>
</svg>
