<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" role="img" aria-label="观澜 · GuanLan">
  <!-- 官方规范 48x48 方标 -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0D5E42"/>
    <g transform="translate(12, 9)">
      <circle cx="9" cy="13" r="3.2" fill="#E74C3C"/>
      <circle cx="15" cy="11" r="3.2" fill="#3498DB"/>
    </g>
    <defs>
      <linearGradient id="logo-stream" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
        <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
      </linearGradient>
    </defs>
    <rect x="8" y="39" width="32" height="3" rx="1.5" fill="url(#logo-stream)"/>
    <polygon points="40.5,5 41.05,6.75 43,6.75 41.4,7.85 41.95,9.55 40.5,8.5 39.05,9.55 39.6,7.85 38,6.75 39.95,6.75" fill="#F1C40F"/>
  </g>

  <!-- 品牌文字 -->
  <text x="64" y="28" fill="#F1C40F" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"
        font-size="18" font-weight="700" letter-spacing="0.06em">观澜 · GuanLan</text>
  <text x="64" y="46" fill="#8FA3BF" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"
        font-size="11">观水有术，由表及澜</text>
</svg>
